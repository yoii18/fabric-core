[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-core-common"
dynamic = ["version"]
description = "Shared utilities for Microsoft Fabric notebooks"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["common*"]

[tool.setuptools.dynamic]
version = {attr = "common.version.__version__"}